# Local production-like stack: API + PostgreSQL (run history and resumable-run checkpoints).
#   cp .env.example .env   # set API_KEYS and, optionally, an LLM key
#   docker compose up --build
services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://agent:agent@db:5432/agent
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
