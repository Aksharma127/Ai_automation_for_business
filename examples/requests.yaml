# Example requests. The first 10 are the Test_Questions from the Excel file (one per workflow);
# the rest exercise conditions, errors and different phrasings.
# Run all of them with:  python -m workflow_agent --run-examples
- {label: restock, expect: WF001, request: "Which products need restocking?"}
- {label: price validation, expect: WF002, request: "Find products where vendor price differs by more than 10%."}
- {label: vendor file, expect: WF003, request: "Process this vendor spreadsheet and show invalid rows."}
- {label: seo content, expect: WF004, request: "Generate SEO content for this product."}
- {label: order status, expect: WF005, request: "Where is order ORD-1001?"}
- {label: duplicates, expect: WF006, request: "Find likely duplicate products in the catalog."}
- {label: campaign missing info, expect: WF007, request: "Create a campaign brief for the new collection."}
- {label: keywords, expect: WF008, request: "Classify these keywords and map them to pages."}
- {label: task assignment, expect: WF009, request: "Assign this urgent task to the best available developer."}
- {label: performance, expect: WF010, request: "Which workflows are failing most often?"}

# --- conditions, errors and alternative phrasings -------------------------------------------
- {label: restock custom threshold, expect: WF001, request: "Check today's inventory and identify products that need restocking, flag anything below 20 units."}
- {label: price tolerance 5pct, expect: WF002, request: "Validate our product prices against the vendor price list with a 5% tolerance."}
- {label: seo content inline product, expect: WF004, request: "Write product content for Merino Wool Scarf, category: Accessories, material: merino wool, color: rust, audience: gift shoppers."}
- {label: order not found, expect: WF005, request: "Where is order ORD-9999?"}
- {label: order by email, expect: WF005, request: "What's the status of my orders? My email is jane.doe@example.com"}
- {label: order carrier api down, expect: WF005, request: "Track my order ORD-1004 please"}
- {label: order no identifier, expect: WF005, request: "Where is my order?"}
- {label: campaign complete, expect: WF007, request: "Create a campaign brief for the new collection to drive online sales with 20% off outerwear, targeting young professionals, from 2026-11-01 to 2026-11-30."}
- {label: task escalation, expect: WF009, request: "Assign an urgent task to a developer - task: migrate the cluster to Kubernetes with Terraform"}
- {label: out of scope, expect: null, request: "Book me a flight to Paris next Tuesday."}
